name: Build MAME 2003-Plus for PS4 R4

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  OO_PS4_TOOLCHAIN: /opt/openorbis

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAME 2003-Plus
        uses: actions/checkout@v4
        with:
          path: mame2003-plus-libretro

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 make tar wget
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          clang --version
          ld.lld --version

      - name: Install OpenOrbis v0.5.4
        run: |
          wget -q --show-progress \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -O /tmp/openorbis-toolchain.tar.gz
          sudo mkdir -p "$OO_PS4_TOOLCHAIN"
          sudo tar --no-same-owner -xzf /tmp/openorbis-toolchain.tar.gz \
            -C "$OO_PS4_TOOLCHAIN" --strip-components=2
          sudo chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          test -s "$OO_PS4_TOOLCHAIN/link.x"
          test -s "$OO_PS4_TOOLCHAIN/lib/crt1.o"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"

      - name: Build MAME 2003-Plus OpenOrbis static core
        working-directory: mame2003-plus-libretro
        run: |
          make platform=ps4 clean
          make platform=ps4 -j$(getconf _NPROCESSORS_ONLN)
          test -s libretro_ps4.a

      - name: Checkout RetroArch R4
        uses: actions/checkout@v4
        with:
          repository: OsirizX/RetroArch
          ref: ps4_r4
          path: RetroArch
          fetch-depth: 1

      - name: Prepare RetroArch R4 for current OpenOrbis
        working-directory: RetroArch
        run: |
          cp ../mame2003-plus-libretro/libretro_ps4.a libretro_ps4.a
          sed -i 's#LIBDIRS += #LIBDIRS += -L$(OO_PS4_TOOLCHAIN)/lib #' Makefile.ps4
          sed -i 's#INCDIRS += #INCDIRS += -I$(OO_PS4_TOOLCHAIN)/include -I$(OO_PS4_TOOLCHAIN)/include/c++/v1 #' Makefile.ps4
          sed -i 's#create-eboot -in=$(TARGET).elf -out=$(TARGET).oelf --paid 0x3800000000000011#create-fself -in=$(TARGET).elf -out=$(TARGET).oelf -eboot=eboot.bin -paid 0x3800000000000011#' Makefile.ps4
          grep -F -- '-L$(OO_PS4_TOOLCHAIN)/lib' Makefile.ps4
          grep -F -- 'create-fself -in=$(TARGET).elf' Makefile.ps4

      - name: Build RetroArch R4 and eboot.bin
        working-directory: RetroArch
        timeout-minutes: 30
        run: |
          make -f Makefile.ps4 -j$(getconf _NPROCESSORS_ONLN) HAVE_CHD=0
          test -s retroarch_ps4.elf
          test -s retroarch_ps4.oelf
          test -s eboot.bin
          ls -lh retroarch_ps4.elf retroarch_ps4.oelf eboot.bin

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mame2003-plus-ps4-r4-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            mame2003-plus-libretro/libretro_ps4.a
            RetroArch/retroarch_ps4.elf
            RetroArch/retroarch_ps4.oelf

      - name: Collect build metadata
        id: metadata
        shell: bash
        run: |
          echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          clang --version
          ld.lld --version

      - name: Upload PS4 R4 build
        uses: actions/upload-artifact@v4
        with:
          name: mame2003-plus-ps4-r4-${{ steps.metadata.outputs.sha8 }}
          if-no-files-found: error
          path: |
            mame2003-plus-libretro/libretro_ps4.a
            RetroArch/retroarch_ps4.elf
            RetroArch/retroarch_ps4.oelf
            RetroArch/eboot.bin
