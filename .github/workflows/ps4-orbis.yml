name: Build MAME 2003-Plus for PS4 ORBIS

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-orbis:latest
      options: --user root

    steps:
      - name: Checkout MAME 2003-Plus
        uses: actions/checkout@v4
        with:
          path: mame2003-plus-libretro

      - name: Install build dependencies
        run: |
          apk add --no-cache bash git go make ncurses-dev python2

      - name: Build MAME 2003-Plus static core
        working-directory: mame2003-plus-libretro
        run: |
          test -n "$ORBISDEV"
          make platform=orbis clean
          make platform=orbis -j$(getconf _NPROCESSORS_ONLN)
          test -s mame2003_plus_libretro_orbis.a

      - name: Checkout RetroArch
        uses: actions/checkout@v4
        with:
          repository: libretro/RetroArch
          path: RetroArch
          fetch-depth: 1

      - name: Checkout OpenOrbis create-fself
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          path: create-fself
          fetch-depth: 1

      - name: Build OpenOrbis create-fself
        working-directory: create-fself/cmd/create-fself
        run: |
          go version
          # Upstream currently checks in Windows-style local replace paths.
          # Convert them to portable Linux paths before Go parses go.mod.
          sed -i 's#\\#/#g; s#//#/#g' go.mod
          grep -F '=> ../../pkg/fself' go.mod
          grep -F '=> ../../pkg/oelf' go.mod
          go build -trimpath -o /usr/local/bin/create-fself .
          create-fself -h || true

      - name: Link the core into RetroArch ELF
        working-directory: RetroArch
        run: |
          cp ../mame2003-plus-libretro/mame2003_plus_libretro_orbis.a libretro_orbis.a
          make -f Makefile.orbis -j$(getconf _NPROCESSORS_ONLN) HAVE_CHD=0 info retroarch_orbis.elf
          test -s retroarch_orbis.elf
          echo "Before strip:"
          ls -lh retroarch_orbis.elf
          orbis-size retroarch_orbis.elf || true

      - name: Convert ELF to eboot.bin with OpenOrbis
        working-directory: RetroArch
        timeout-minutes: 15
        run: |
          command -v orbis-strip
          command -v create-fself
          cp retroarch_orbis.elf retroarch_orbis.unstripped.elf
          orbis-strip --strip-unneeded retroarch_orbis.elf
          echo "After strip:"
          ls -lh retroarch_orbis.unstripped.elf retroarch_orbis.elf
          orbis-size retroarch_orbis.elf || true
          timeout -s TERM 10m create-fself \
            -in retroarch_orbis.elf \
            -out retroarch_orbis.oelf \
            -eboot eboot.bin \
            -paid 0x3800000000000011
          cp eboot.bin retroarch_orbis.self
          test -s retroarch_orbis.elf
          test -s retroarch_orbis.oelf
          test -s retroarch_orbis.self
          test -s eboot.bin

      - name: Upload conversion diagnostics if conversion fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mame2003-plus-ps4-conversion-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            RetroArch/retroarch_orbis.elf
            RetroArch/retroarch_orbis.unstripped.elf
            RetroArch/retroarch_orbis.oelf

      - name: Collect build metadata
        id: metadata
        shell: bash
        run: |
          echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          clang --version
          orbis-ld --version

      - name: Upload PS4 build
        uses: actions/upload-artifact@v4
        with:
          name: mame2003-plus-ps4-${{ steps.metadata.outputs.sha8 }}
          if-no-files-found: error
          path: |
            mame2003-plus-libretro/mame2003_plus_libretro_orbis.a
            RetroArch/retroarch_orbis.elf
            RetroArch/retroarch_orbis.oelf
            RetroArch/retroarch_orbis.self
            RetroArch/eboot.bin
